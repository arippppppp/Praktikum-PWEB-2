<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>GameZone - Contact</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(to right, #141e30, #243b55);
        }

        .hero-section {
            padding: 120px 0 60px 0;
            text-align: center;
            color: white;
        }

        .contact-card {
            background-color: #130f0f;
            border: none;
            border-radius: 20px;
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .form-control {
            background-color: #2c2c2c;
            border: 1px solid #444;
            color: white;
        }

        .form-control:focus {
            background-color: #2c2c2c;
            color: white;
            border-color: #ff9800;
            box-shadow: none;
        }

        .btn-custom {
            background-color: #ff9800;
            border: none;
            color: white;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background-color: #e68900;
            transform: scale(1.05);
        }

        footer {
            background-color: #000;
        }
    </style>
</head>

<body class="pt-5">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-black shadow fixed-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">GameZone</a>

    <!-- Hamburger -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">`
        <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Hero -->
<section class="hero-section">
    <h1 class="display-4 fw-bold">📩 Contact Us</h1>
    <p class="lead">Hubungi kami untuk pertanyaan atau kerja sama</p>
</section>

<!-- Form Section -->
<section class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card contact-card p-4">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Nama</label>
                        <input type="text" class="form-control" placeholder="Masukkan nama Anda">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Masukkan email Anda">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Pesan</label>
                        <textarea class="form-control" rows="4" placeholder="Tulis pesan Anda..."></textarea>
                    </div>

                    <button type="submit" class="btn btn-custom w-100">Kirim Pesan</button>
                </form>
            </div>
        </div>
    </div>
</section>

<!-- Footer -->
<footer class="text-white text-center p-3">
    <p class="mb-0">© 2026 GameZone | Contact</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
